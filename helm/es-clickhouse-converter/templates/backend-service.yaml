apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecc.backend.fullname" . }}
  labels:
    {{- include "ecc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with (merge (deepCopy .Values.backend.service.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ecc.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
