{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecc.serviceAccountName" . }}
  labels:
    {{- include "ecc.labels" . | nindent 4 }}
  {{- with (merge (deepCopy .Values.serviceAccount.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
