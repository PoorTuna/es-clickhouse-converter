{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecc.backend.fullname" . }}
  labels:
    {{- include "ecc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "ecc.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the UI pods may reach the backend.
    - from:
        - podSelector:
            matchLabels:
              {{- include "ecc.selectorLabels" (dict "root" . "component" "ui") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecc.ui.fullname" . }}
  labels:
    {{- include "ecc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      {{- include "ecc.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.ui.containerPort }}
      {{- with .Values.networkPolicy.uiIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
