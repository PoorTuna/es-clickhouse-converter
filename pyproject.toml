[project]
name = "ch-converter"
version = "0.5.0"
description = "Deterministic offline Elasticsearch _mapping → ClickHouse DDL converter (FastAPI + CLI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic>=2.6",
    "prometheus-fastapi-instrumentator==7.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[project.scripts]
ch-converter = "ch_converter.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ch_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-vv --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ch_converter"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
