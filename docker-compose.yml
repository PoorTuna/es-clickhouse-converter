services:
  converter:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO

  # Optional local ClickHouse for dry-running generated DDL. 25.3+ has the JSON
  # type production-ready (experimental on 24.8), so generated JSON columns work
  # without SET allow_experimental_json_type.
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.7
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
